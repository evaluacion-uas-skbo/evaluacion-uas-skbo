<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Evaluación ATS · Intrusión de UAS en SKBO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EDF0; --surface:#FFFFFF; --ink:#13222C; --muted:#56656F; --line:#C6CFD5;
  --strip:#F4E6C2; --strip-edge:#C9A85A; --tower:#1D4E6B; --tower-ink:#FFFFFF;
  --amber:#D9900F; --ok:#2E7D4F; --ok-bg:#E2F1E7; --bad:#A3203A; --bad-bg:#F7E3E7;
  --focus:#1D6FA3;
  --sans:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A21; --surface:#17252F; --ink:#E6ECEF; --muted:#9AAAB4; --line:#2E404C;
    --strip:#3A3220; --strip-edge:#8F7536; --tower:#2A6A8F; --tower-ink:#FFFFFF;
    --amber:#F0A830; --ok:#6CC08E; --ok-bg:#183326; --bad:#F07B92; --bad-bg:#3A1D25; --focus:#6FB5E0;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1A21; --surface:#17252F; --ink:#E6ECEF; --muted:#9AAAB4; --line:#2E404C;
  --strip:#3A3220; --strip-edge:#8F7536; --tower:#2A6A8F; --tower-ink:#FFFFFF;
  --amber:#F0A830; --ok:#6CC08E; --ok-bg:#183326; --bad:#F07B92; --bad-bg:#3A1D25; --focus:#6FB5E0;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:20px 18px 48px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:8px 0 18px;border-bottom:2px solid var(--ink);margin-bottom:24px}
.callsign{font-family:var(--cond);font-weight:700;font-size:clamp(2rem,6vw,3.1rem);line-height:.95;letter-spacing:.01em;margin:0}
.callsign small{display:block;font-weight:500;font-size:.45em;color:var(--muted);letter-spacing:.02em;margin-top:6px}
.btn{appearance:none;border:2px solid var(--ink);background:var(--ink);color:var(--bg);font-family:var(--cond);font-weight:600;font-size:1.1rem;padding:10px 20px;border-radius:4px;cursor:pointer;min-height:44px}
.btn:hover{filter:brightness(1.15)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink)}
.hidden{display:none!important}
.lead{max-width:62ch;color:var(--muted);margin:0 0 22px}

/* Flight strip: the signature device */
.strip{background:var(--strip);border:1px solid var(--strip-edge);border-left:10px solid var(--strip-edge);border-radius:3px;display:grid;grid-template-columns:auto 1fr;gap:0}
.strip .tag{font-family:var(--cond);font-weight:700;font-size:1.05rem;padding:10px 12px;border-right:1px dashed var(--strip-edge);display:flex;align-items:flex-start;min-width:62px}
.strip .body{padding:10px 14px}

form.reg{display:grid;grid-template-columns:1fr 1fr;gap:16px 18px;max-width:720px}
form.reg .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.95rem}
label.f input{border:1.5px solid var(--line);background:var(--surface);border-radius:4px;padding:10px 12px;min-height:44px;font-weight:400}
.note{font-size:.92rem;color:var(--muted)}
.err{color:var(--bad);font-weight:600}

/* Video + route */
.stage{background:#000;border-radius:6px;overflow:hidden;position:relative}
.stage video{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#000}
.route{display:grid;grid-template-columns:190fr 194fr 132fr;gap:4px;margin:10px 0 6px}
.leg{position:relative;height:38px;background:var(--surface);border:1px solid var(--line);border-radius:3px;overflow:hidden}
.leg .fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--tower);opacity:.22}
.leg .lbl{position:relative;display:flex;align-items:center;gap:8px;height:100%;padding:0 10px;font-family:var(--cond);font-weight:600;font-size:.98rem;white-space:nowrap;overflow:hidden}
.leg .num{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink);font-size:.85rem;flex:none}
.leg.done .num{background:var(--ok);border-color:var(--ok);color:#fff}
.leg.now{border-color:var(--tower)}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0 22px}
.controls .time{font-family:var(--cond);font-size:1.05rem;color:var(--muted);margin-left:auto}

/* Questions */
.qpanel h2{font-family:var(--cond);font-weight:700;font-size:1.7rem;margin:0 0 4px}
.qpanel .sub{color:var(--muted);margin:0 0 18px}
.q{margin:0 0 16px}
.q .prompt{font-weight:600;margin:0 0 10px;max-width:72ch}
.opts{display:grid;gap:8px;margin:0;padding:0;border:0}
.opt{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;background:var(--surface);border:1.5px solid var(--line);border-radius:4px;padding:10px 12px;cursor:pointer}
.opt input{margin:3px 0 0;width:18px;height:18px;accent-color:var(--tower)}
.opt:has(input:checked){border-color:var(--tower);box-shadow:inset 0 0 0 1px var(--tower)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opts[disabled] .opt{cursor:default}
.why{margin:10px 0 0;font-size:.95rem;padding:10px 12px;border-left:4px solid var(--tower);background:var(--surface)}
.why b{font-family:var(--cond);font-size:1.02rem}
.verdict{font-family:var(--cond);font-weight:700}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--bad)}
.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:18px}

/* Result */
.score{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:0 0 6px}
.score .big{font-family:var(--cond);font-weight:700;font-size:clamp(3.4rem,12vw,5.5rem);line-height:1}
.score .of{font-family:var(--cond);font-size:1.6rem;color:var(--muted)}
.stamp{display:inline-block;font-family:var(--cond);font-weight:700;font-size:1.3rem;padding:4px 14px;border:3px solid currentColor;border-radius:4px;transform:rotate(-3deg)}
.stamp.ok{color:var(--ok)} .stamp.no{color:var(--bad)}
.mods{display:grid;gap:8px;margin:20px 0}

/* Admin */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:820px;font-size:.95rem}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--cond);font-weight:600;font-size:1rem;background:var(--strip);position:sticky;top:0}
td.n{font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:.85rem;font-weight:600}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.no{background:var(--bad-bg);color:var(--bad)} .pill.mid{background:var(--strip);color:var(--ink)}
.empty{padding:28px;text-align:center;color:var(--muted)}

@media (max-width:640px){
  form.reg{grid-template-columns:1fr}
  .route{grid-template-columns:1fr 1fr 1fr}
  .leg .lbl .txt{display:none}
  body{font-size:16px}
}
@media (prefers-reduced-motion:no-preference){
  .stamp{animation:stamp .35s ease-out}
  @keyframes stamp{from{transform:rotate(-3deg) scale(1.6);opacity:0}to{transform:rotate(-3deg) scale(1);opacity:1}}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 class="callsign">Intrusión de UAS en SKBO<small>Evaluación técnica para CTA y personal operacional ATS</small></h1>
  </header>

  <!-- 1. Registro -->
  <section id="vReg">
    <p class="lead">Vea el video completo. Al terminar cada módulo el video se detiene y aparecen las preguntas de ese módulo. Responda para continuar. Son 10 preguntas en total.</p>
    <form class="reg" id="formReg" novalidate>
      <label class="f full">Nombre completo<input name="nombre" autocomplete="name" required></label>
      <label class="f">Documento de identidad<input name="documento" inputmode="numeric" required></label>
      <label class="f">Correo electrónico<input name="correo" type="email" autocomplete="email" required></label>
      <label class="f">Cargo<input name="cargo" required></label>
      <label class="f">Dependencia<input name="dependencia" required></label>
      <p class="full err hidden" id="regErr"></p>
      <p class="full note" id="regNote"></p>
      <div class="full"><button class="btn" type="submit" id="btnStart">Iniciar evaluación</button></div>
    </form>
  </section>

  <!-- 2. Examen -->
  <section id="vExam" class="hidden">
    <div class="stage"><video id="vid" playsinline preload="metadata" controlslist="nodownload noplaybackrate" disablepictureinpicture></video></div>
    <div class="route" id="route"></div>
    <div class="controls">
      <button class="btn" type="button" id="btnPlay">Reproducir</button>
      <button class="btn ghost" type="button" id="btnBack">Retroceder 10 s</button>
      <span class="time" id="time">0:00 / 8:36</span>
    </div>
    <p class="err hidden" id="vidErr"></p>
    <section class="qpanel hidden" id="qpanel" aria-live="polite"></section>
  </section>

  <!-- 3. Resultado -->
  <section id="vRes" class="hidden"></section>

</div>

<script>
/* ---------- Configuración ---------- */
// 1) Pegue entre las comillas la URL de la aplicación web de Google Apps Script (termina en /exec)
const SHEETS_URL = "https://script.google.com/macros/s/AKfycbyHApTeHcCfCTx70zJqCsAhrGbGlFvpXZlOSOENVLqdnaF5_1NFm3uRB2whh8FiKCTD/exec";
// 2) El video va en la misma carpeta que este archivo, con el nombre video.mp4
const VIDEO_SRC = "video.mp4";
const NOTA_APROBACION = 0.8;   // 80 % = 8 de 10
const MODULOS = [
  { n:1, titulo:"Marco normativo RAC 100", inicio:0,     fin:190.5 },
  { n:2, titulo:"Protocolo de intrusión",  inicio:190.5, fin:384.5 },
  { n:3, titulo:"Acuerdo operacional CATAM – El Dorado", inicio:384.5, fin:null } // fin = final del video
];
const PREGUNTAS = [
 {m:1,id:"q1",t:"De acuerdo con el RAC 100, ¿cuál es el límite de masa bruta máxima de operación y la finalidad permitida para la Categoría Abierta de UAS?",
  o:{A:"Hasta 250 kg de peso bruto al despegue, destinada exclusivamente a actividades comerciales.",B:"Hasta 25 kg de peso bruto al despegue, limitada a operaciones no comerciales (sin ánimo de lucro) durante toda la operación.",C:"Sin límite de peso, siempre que cuente con licencia médica de piloto a distancia expedida por la UAEAC.",D:"Hasta 10 kg de peso bruto, únicamente para entidades públicas y la Aviación de Estado."},
  c:"B",j:"La Categoría Abierta abarca únicamente operaciones no comerciales (sin ánimo de lucro) con una masa bruta máxima de operación de hasta 25 kg en el despegue, condición que debe mantenerse durante todo el vuelo."},
 {m:1,id:"q2",t:"En la Categoría Abierta del RAC 100, ¿cuál es la excepción geográfica permitida respecto al Punto de Referencia del Aeródromo (ARP) de El Dorado y su restricción vertical?",
  o:{A:"Se permite volar libremente a cualquier altura a partir de los 2 km del ARP.",B:"Está totalmente prohibido volar en un radio de 15 km del ARP bajo cualquier circunstancia.",C:"Entre los 6 km y los 9 km del ARP, se permite la operación en categoría abierta si la altura no excede los 200 pies (61 m) sobre la elevación del umbral más bajo del aeródromo.",D:"Entre los 3 km y los 5 km del ARP, siempre que no se superen los 500 pies de altura sobre el terreno."},
  c:"C",j:"El RAC 100 prohíbe vuelos de categoría abierta dentro de los 9 km del ARP; sin embargo, permite operaciones entre los 6 km y 9 km medidos desde el ARP siempre que la altura no exceda de 200 pies (61 m) sobre el umbral más bajo."},
 {m:1,id:"q3",t:"Para que un dron opere en Categoría Específica en las inmediaciones de un aeródromo controlado como SKBO, se exigen cuatro reglas esenciales. ¿En qué escenario se contempla una excepción al proceso de Toma de Decisiones Conjuntas (CDM) con la Torre de Control?",
  o:{A:"Cuando el vuelo se realice en horarios nocturnos de baja afluencia de tránsito aéreo.",B:"Cuando la operación se efectúe entre los 6 km y 9 km del aeródromo y por debajo de 200 pies (61 m) de altura.",C:"Cuando el dron pertenezca a medios de comunicación masiva y transporte carga (Drone Delivery).",D:"Cuando la aeronave no tripulada pese menos de 2 kg y posea transmisor ADS-B activo."},
  c:"B",j:"Aunque operar en categoría específica cerca a un aeródromo requiere CDM con ATS, la normativa estipula que entre los 6 km y 9 km del aeródromo no se exige proceso CDM, siempre que se vuele por debajo de 200 pies de altura."},
 {m:2,id:"q4",t:"Si la Torre de Control recibe un reporte de intrusión de UAS proveniente de un tercero o dependencia de seguridad no confirmada (Caso B), ¿cuál es la responsabilidad inmediata del CTA conforme al Doc 4444 de la OACI?",
  o:{A:"Declarar de forma inmediata el cierre definitivo del aeródromo por un tiempo mínimo de 60 minutos.",B:"Transmitir inmediatamente la información referente al “Tránsito Esencial Local” a las aeronaves que salgan y lleguen, mientras se escala al DONA para verificación.",C:"Ordenar la cancelación instantánea de todas las aproximaciones en un radio de 20 millas náuticas.",D:"Ignorar la alerta hasta que la Fuerza Pública confirme por escrito la presencia del artefacto."},
  c:"B",j:"Ante reportes no confirmados por el CTA o C-UAS, el controlador debe transmitir inmediatamente la información de Tránsito Esencial Local (OACI Doc 4444) a los tránsitos de salida y llegada, mientras el DONA verifica la veracidad con la Fuerza Pública."},
 {m:2,id:"q5",t:"Al recibir la notificación de activación de un sistema de contramedidas electrónicas C-UAS por parte de la Fuerza Pública, ¿sobre qué afectaciones en los sistemas CNS debe alertar el CTA a las tripulaciones aéreas?",
  o:{A:"Fallas exclusivas en los sistemas de iluminación de pista y luces de aproximación VASI/PAPI.",B:"Interferencia en la banda GPS, degradación de servicios GNSS, impacto en sistemas dependientes de ADS-B y en aproximaciones basadas en GNSS.",C:"Pérdida total de comunicaciones en banda HF y falla en los radares primarios de vigilancia PSR.",D:"Descalibración de los altímetros barométricos de las aeronaves comerciales en espera."},
  c:"B",j:"Las contramedidas electrónicas C-UAS afectan los sistemas de Comunicaciones, Navegación y Vigilancia: inhibición en la banda GPS, degradación GNSS, afectación a ADS-B y compromiso de las aproximaciones instrumentales GNSS."},
 {m:2,id:"q6",t:"¿Cómo se define geográficamente el “Área Crítica” (identificada con color carmesí) en el mapa de restricción del Aeropuerto El Dorado?",
  o:{A:"Un anillo perimetral comprendido entre las 2 y las 5 millas náuticas desde el ARP.",B:"El polígono situado sobre la pista de aterrizaje, los conos de aproximación de los 4 umbrales, las instalaciones aeroportuarias y el complejo de combustibles.",C:"El espacio aéreo comprendido únicamente por encima de los 10,000 pies sobre el VOR de Bogotá.",D:"El área circundante a la Base Aérea de CATAM excluyendo las pistas comerciales."},
  c:"B",j:"El Área Crítica (carmesí) abarca el polígono sobre las pistas, los conos de aproximación de los cuatro umbrales (pistas norte y sur), las instalaciones del aeropuerto y el complejo de combustibles."},
 {m:2,id:"q7",t:"En presencia de una intrusión clasificada como Riesgo CRÍTICO, ¿cuáles son los tiempos sugeridos de restricción/suspensión de operaciones según el contacto visual con el UAS?",
  o:{A:"60 minutos sin contacto visual / 45 minutos con contacto visual.",B:"10 minutos sin contacto visual / 5 minutos con contacto visual.",C:"30 minutos cuando NO se hace contacto visual / 15 minutos cuando SÍ se hace contacto visual con el UA/UAS.",D:"20 minutos fijos de suspensión independientemente de la visualización del objetivo."},
  c:"C",j:"La matriz de respuesta del procedimiento MSER-4.0-06-048 establece 30 minutos de restricción cuando no hay contacto visual con el dron y 15 minutos cuando se confirma contacto visual directo."},
 {m:2,id:"q8",t:"¿Cuál es el texto exacto de la fraseología no estandarizada requerida para el reporte en el servicio ATIS en idioma inglés ante una restricción por Riesgo Crítico?",
  o:{A:"“Warning, unidentified flying object reported near runway 13L, exercise caution.”",B:"“Aerodrome Closed Due To the Presence Of Unauthorized Unmanned Aircraft System (UAS) in the Aerodrome Traffic Zone.”",C:"“All aircraft hold position due to military C-UAS deployment in progress.”",D:"“Emergency status activated, divert to alternate aerodromes immediately.”"},
  c:"B",j:"El protocolo especifica que para el reporte ATIS en inglés bajo Riesgo Crítico se emite: “Aerodrome Closed Due To the Presence Of Unauthorized Unmanned Aircraft System (UAS) in the Aerodrome Traffic Zone.”"},
 {m:3,id:"q9",t:"Según la Carta de Acuerdo Operacional para las operaciones del Sistema SIVAR (FAC/CATAM), ¿cuál es la restricción genérica de altura y distancia lateral respecto a los ejes de pista?",
  o:{A:"Altura máxima de 200 pies y distancia lateral mínima de 1,000 metros del eje de pista.",B:"Altura máxima de 50 pies, aplicando la restricción de hasta 300 metros a cada lado del eje de pista y su proyección hasta 300 metros del umbral.",C:"Sin restricción de altura, siempre que el dron vuele dentro de las 7 zonas urbanas aprobadas.",D:"Altura máxima de 100 pies y distancia lateral de 50 metros del eje de la calle de rodaje."},
  c:"B",j:"La normativa SIVAR restringe las alturas a máximo 50 pies en cercanías a las trayectorias, hasta 300 metros a cada lado del eje de las pistas y su proyección hasta 300 metros del umbral."},
 {m:3,id:"q10",t:"En caso de una “Activación de la Defensa de la Unidad Militar” en CATAM ante una amenaza latente, ¿cuál es la condición indispensable para operar drones dentro del complejo aeroportuario?",
  o:{A:"Se pueden despegar los drones inmediatamente sin avisar a la Torre para mantener el factor sorpresa.",B:"Solo se requiere notificación posterior por correo electrónico al Director de Navegación Aérea.",C:"Solicitar de inmediato la autorización a la Torre de Control del aeropuerto, operando únicamente con su aprobación previa y sin comprometer la seguridad de las operaciones aéreas.",D:"Asumir el control exclusivo de toda la frecuencia de la Torre de Control por parte del comandante del CCOSD."},
  c:"C",j:"Al activar la defensa militar se solicita de inmediato a la Torre la autorización para volar dentro del complejo; solo se opera con la debida autorización de la Torre y sin poner en riesgo las operaciones aéreas."}
];

/* ---------- Estado ---------- */
const $ = s => document.querySelector(s);
const vid = $("#vid");
const conectado = /^https:\/\/script\.google\.com\//.test(SHEETS_URL);
let participante=null, intento=null, moduloActual=0, maxVisto=0, enPreguntas=false;
const fmt = s => { s=Math.max(0,Math.floor(s||0)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); };
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const show = id => ["#vReg","#vExam","#vRes"].forEach(v=>$(v).classList.toggle("hidden",v!==id));
const finModulo = i => MODULOS[i].fin ?? (vid.duration || 516);

/* ---------- Aviso de configuración ---------- */
if(!conectado) $("#regNote").textContent = "Aviso para el administrador: falta configurar la URL de Google Sheets; los resultados no se guardarán.";

/* ---------- Registro ---------- */
$("#formReg").addEventListener("submit", e=>{
  e.preventDefault();
  const f = new FormData(e.target), d = Object.fromEntries([...f].map(([k,v])=>[k,String(v).trim()]));
  const falta = ["nombre","documento","correo","cargo","dependencia"].filter(k=>!d[k]);
  const err = $("#regErr");
  if(falta.length){ err.textContent="Complete todos los campos para continuar."; err.classList.remove("hidden"); return; }
  if(!/^\S+@\S+\.\S+$/.test(d.correo)){ err.textContent="Revise el correo electrónico."; err.classList.remove("hidden"); return; }
  err.classList.add("hidden");
  participante = d;
  intento = { id:"i"+Date.now(), inicio:new Date().toISOString(), fin:null, estado:"en curso", respuestas:{}, modulos:[null,null,null], total:0 };
  guardar();
  startExam();
});

/* ---------- Persistencia (Google Sheets) ---------- */
let guardando=Promise.resolve(), envioOk=false;
function guardar(){
  if(!conectado || !participante) return guardando;
  const it = intento, md = k => it.modulos[k] ? it.modulos[k].correctas : "";
  const fila = {
    id: it.id, inicio: it.inicio, fin: it.fin || "",
    nombre: participante.nombre, documento: participante.documento, correo: participante.correo,
    cargo: participante.cargo, dependencia: participante.dependencia,
    m1: md(0), m2: md(1), m3: md(2), total: it.total,
    estado: it.estado==="en curso" ? "incompleto" : it.estado,
    respuestas: PREGUNTAS.map(q=>it.respuestas[q.id]||"")
  };
  guardando = guardando.then(()=>fetch(SHEETS_URL,{
    method:"POST", mode:"no-cors", keepalive:true,
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body: JSON.stringify(fila)
  })).then(()=>{ envioOk=true; }).catch(e=>{ envioOk=false; console.warn("No se guardó", e); });
  return guardando;
}

/* ---------- Video ---------- */
function buildRoute(){
  $("#route").innerHTML = MODULOS.map((m,i)=>`<div class="leg" id="leg${i}"><div class="fill"></div><div class="lbl"><span class="num">${m.n}</span><span class="txt">${esc(m.titulo)}</span></div></div>`).join("");
}
function paintRoute(){
  const t = vid.currentTime;
  MODULOS.forEach((m,i)=>{
    const leg=$("#leg"+i), fin=finModulo(i);
    const p = Math.min(1,Math.max(0,(t-m.inicio)/(fin-m.inicio)));
    leg.querySelector(".fill").style.width=(p*100)+"%";
    leg.classList.toggle("done", !!intento?.modulos[i]);
    leg.classList.toggle("now", i===moduloActual && !intento?.modulos[i]);
  });
  $("#time").textContent = fmt(t)+" / "+fmt(vid.duration||516);
}
function startExam(){
  show("#vExam"); buildRoute(); moduloActual=0; maxVisto=0; enPreguntas=false;
  $("#qpanel").classList.add("hidden");
  if(!VIDEO_SRC){ $("#vidErr").textContent="El video aún no está cargado en esta página."; $("#vidErr").classList.remove("hidden"); }
  else { vid.src = VIDEO_SRC; vid.currentTime = 0; }
  paintRoute();
}
$("#btnPlay").addEventListener("click", ()=>{
  if(enPreguntas) return;
  if(vid.paused){ vid.play().catch(()=>{}); } else vid.pause();
});
$("#btnBack").addEventListener("click", ()=>{
  if(enPreguntas) return;
  vid.currentTime = Math.max(MODULOS[moduloActual].inicio, vid.currentTime-10);
});
vid.addEventListener("click", ()=>$("#btnPlay").click());
vid.addEventListener("play", ()=>$("#btnPlay").textContent="Pausar");
vid.addEventListener("pause", ()=>$("#btnPlay").textContent="Reproducir");
vid.addEventListener("error", ()=>{ $("#vidErr").textContent="No se pudo cargar el video. Recargue la página."; $("#vidErr").classList.remove("hidden"); });
vid.addEventListener("loadedmetadata", paintRoute);
vid.addEventListener("timeupdate", ()=>{
  if(enPreguntas) return;
  const t=vid.currentTime, fin=MODULOS[moduloActual].fin;
  if(t > maxVisto+1.5){ vid.currentTime = maxVisto; return; } // no se permite adelantar
  maxVisto = Math.max(maxVisto, t);
  if(fin!==null && t>=fin){ vid.pause(); vid.currentTime=fin; abrirPreguntas(moduloActual); }
  paintRoute();
});
vid.addEventListener("seeking", ()=>{ if(!enPreguntas && vid.currentTime > maxVisto+1.5) vid.currentTime = maxVisto; });
vid.addEventListener("ended", ()=>{ if(moduloActual===MODULOS.length-1 && !intento.modulos[moduloActual]) abrirPreguntas(moduloActual); });

/* ---------- Preguntas ---------- */
function abrirPreguntas(i){
  enPreguntas=true;
  const m=MODULOS[i], qs=PREGUNTAS.filter(q=>q.m===m.n);
  const p=$("#qpanel");
  p.innerHTML = `<h2>Módulo ${m.n}: ${esc(m.titulo)}</h2><p class="sub">Responda las ${qs.length} preguntas para continuar con el video.</p>`+
    qs.map((q,k)=>`<div class="q strip" data-q="${q.id}"><div class="tag">P${PREGUNTAS.indexOf(q)+1}</div><div class="body">
      <p class="prompt" id="p_${q.id}">${esc(q.t)}</p>
      <fieldset class="opts" aria-labelledby="p_${q.id}">${Object.entries(q.o).map(([l,txt])=>`
        <label class="opt" data-l="${l}"><input type="radio" name="${q.id}" value="${l}"><span><b>${l})</b> ${esc(txt)}</span></label>`).join("")}
      </fieldset><div class="fb"></div></div></div>`).join("")+
    `<div class="actions"><button class="btn" type="button" id="btnEnviar">Enviar respuestas</button><span class="err hidden" id="qErr"></span></div>`;
  p.classList.remove("hidden");
  paintRoute();
  p.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth", block:"start"});
  $("#btnEnviar").addEventListener("click", ()=>enviar(i,qs));
}
async function enviar(i,qs){
  const resp={}; let ok=0;
  for(const q of qs){ const r=document.querySelector(`input[name="${q.id}"]:checked`); if(!r){ const e=$("#qErr"); e.textContent="Falta responder al menos una pregunta."; e.classList.remove("hidden"); return; } resp[q.id]=r.value; }
  qs.forEach(q=>{
    const box=document.querySelector(`[data-q="${q.id}"]`), fs=box.querySelector("fieldset");
    fs.disabled=true; fs.setAttribute("disabled","");
    const bien = resp[q.id]===q.c; if(bien) ok++;
    box.querySelector(`.opt[data-l="${q.c}"]`).classList.add("right");
    if(!bien) box.querySelector(`.opt[data-l="${resp[q.id]}"]`).classList.add("wrong");
    box.querySelector(".fb").innerHTML=`<p class="why"><span class="verdict ${bien?"ok":"no"}">${bien?"Correcta.":"Incorrecta. La respuesta es "+q.c+"."}</span> ${esc(q.j)}</p>`;
  });
  Object.assign(intento.respuestas,resp);
  intento.modulos[i]={correctas:ok,total:qs.length};
  intento.total = intento.modulos.reduce((a,x)=>a+(x?.correctas||0),0);
  const ultimo = i===MODULOS.length-1;
  if(ultimo){ intento.fin=new Date().toISOString(); intento.estado = intento.total/PREGUNTAS.length>=NOTA_APROBACION?"aprobado":"no aprobado"; }
  guardar();
  paintRoute();
  const a=document.querySelector("#qpanel .actions");
  a.innerHTML = `<span class="verdict">${ok} de ${qs.length} correctas en este módulo.</span><button class="btn" type="button" id="btnSeguir">${ultimo?"Ver resultado":"Continuar con el módulo "+(i+2)}</button>`;
  $("#btnSeguir").addEventListener("click", ()=>{
    if(ultimo){ mostrarResultado(); return; }
    moduloActual=i+1; enPreguntas=false; maxVisto=Math.max(maxVisto,MODULOS[moduloActual].inicio);
    $("#qpanel").classList.add("hidden");
    vid.currentTime = MODULOS[moduloActual].inicio + 0.05;
    $(".stage").scrollIntoView({block:"start"});
    vid.play().catch(()=>{});
    paintRoute();
  });
}

/* ---------- Resultado ---------- */
async function mostrarResultado(){
  const aprobado = intento.estado==="aprobado";
  $("#vRes").innerHTML = `
    <p class="lead">${esc(participante.nombre)} · ${esc(participante.cargo)}, ${esc(participante.dependencia)}</p>
    <div class="score"><span class="big">${intento.total}</span><span class="of">de ${PREGUNTAS.length} correctas</span>
      <span class="stamp ${aprobado?"ok":"no"}">${aprobado?"Aprobado":"No aprobado"}</span></div>
    <p class="note">Para aprobar se requieren ${Math.ceil(NOTA_APROBACION*PREGUNTAS.length)} respuestas correctas.</p>
    <div class="mods">${MODULOS.map((m,i)=>`<div class="strip"><div class="tag">M${m.n}</div><div class="body">${esc(m.titulo)}: <b>${intento.modulos[i].correctas} de ${intento.modulos[i].total}</b></div></div>`).join("")}</div>
    <p class="note" id="saveNote">Guardando resultado…</p>
    <div class="actions"><button class="btn ghost" type="button" id="btnOtra">Presentar de nuevo</button></div>`;
  show("#vRes");
  window.scrollTo(0,0);
  $("#btnOtra").addEventListener("click", ()=>{ vid.pause(); show("#vReg"); });
  await guardando;
  $("#saveNote").textContent = (conectado && envioOk) ? "Su resultado quedó registrado." : "No se pudo registrar el resultado. Revise su conexión y tome una captura de esta pantalla.";
}

</script>
